PackageName: org.prauga.journal
Name: Journal
Summary: A private diary with a timeline, photos, tags and Markdown
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/Notes
IssueTracker: https://github.com/PVOT-OSS/Notes/issues
WebSite: ""
Categories:
  - Writing
Description: |
  Journal is a private diary for your days. Write dated entries in
  Markdown, add photos and tags, and look back on a timeline grouped by
  day, week or month, with a week strip that marks the days you wrote.
  Share text or a photo from any app into a new entry. Journal has no ads,
  accounts or tracking, and no internet permission: your journal stays on
  your phone.

RepoType: git
Repo: https://github.com/PVOT-OSS/Notes.git

