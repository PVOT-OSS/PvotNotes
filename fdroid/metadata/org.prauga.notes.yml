PackageName: org.prauga.notes
Name: Notes
Summary: Private notes with Markdown, checklists, tags, colours and collections
License: Apache-2.0
AuthorName: Saalim Quadri
SourceCode: https://github.com/PVOT-OSS/Notes
IssueTracker: https://github.com/PVOT-OSS/Notes/issues
WebSite: ""
Categories:
  - Writing
Description: |
  Notes is a clean, private place for lists, ideas, plans and drafts. Write
  in Markdown and read it formatted, tick checklists straight in a note, and
  find things with search, tags, colours and collections. Share text from any
  app into a new note. Notes has no ads, accounts or tracking, and no
  internet permission: your notes stay on your phone.

RepoType: git
Repo: https://github.com/PVOT-OSS/Notes.git

Builds:
  - versionName: 1.0.0
    versionCode: 10000
    commit: notes-v1.0.0
    subdir: notes
    submodules: true
    gradle:
      - yes

CurrentVersion: "1.0.0"
